name: Environment Variable Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  env-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check environment variable documentation
        run: |
          if [ -f scripts/check-env-sync.mjs ]; then
            node scripts/check-env-sync.mjs
          else
            echo "⚠️ scripts/check-env-sync.mjs not found"
            echo "Creating it now..."
            mkdir -p scripts
            echo "Script should be at scripts/check-env-sync.mjs"
            exit 1
          fi